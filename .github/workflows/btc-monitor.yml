name: BTC Market Scan
on:
  schedule:
    - cron: '*/5 5-21 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore alert state
        uses: actions/cache/restore@v3
        with:
          path: .alert_state.json
          key: alert-state-v1
      - name: Run market scan
        run: python3 market_scan_v2.py
      - name: Save alert state
        uses: actions/cache/save@v3
        if: always()
        with:
          path: .alert_state.json
          key: alert-state-v1
